<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Properties - EliteMC Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/frontend/admin/dashboard.html" class="text-2xl font-bold text-indigo-600">EliteMC Admin</a>
                <div id="auth-links" class="flex items-center gap-4"></div>
            </div>
        </div>
    </nav>

    <div class="bg-indigo-600 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-bold mb-2">Manage Properties</h1>
            <p class="text-indigo-100">Create and update properties</p>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <a href="/frontend/admin/dashboard.html" class="text-indigo-600 hover:underline mb-4 inline-block">← Back to Dashboard</a>

        <!-- Create Property Form -->
        <div class="bg-white rounded-2xl shadow-md p-6 mb-8">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">Create New Property</h3>
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Title</label>
                    <input type="text" id="title" placeholder="Luxury Apartment Complex"
                           class="w-full px-4 py-2 rounded-xl border border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Location</label>
                    <input type="text" id="location" placeholder="Port Louis, Mauritius"
                           class="w-full px-4 py-2 rounded-xl border border-gray-300">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                    <textarea id="description" rows="3" placeholder="Property description..."
                              class="w-full px-4 py-2 rounded-xl border border-gray-300"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Price per Lot (MUR)</label>
                    <input type="number" id="price-per-lot" placeholder="50000"
                           class="w-full px-4 py-2 rounded-xl border border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Total Lots</label>
                    <input type="number" id="total-lots" placeholder="100"
                           class="w-full px-4 py-2 rounded-xl border border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Min Lot Purchase</label>
                    <input type="number" id="min-lot" value="1"
                           class="w-full px-4 py-2 rounded-xl border border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
                    <select id="status" class="w-full px-4 py-2 rounded-xl border border-gray-300">
                        <option value="DRAFT">Draft</option>
                        <option value="OPEN">Open</option>
                    </select>
                </div>
            </div>
            <button id="create-btn" class="mt-4 w-full px-4 py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700">
                Create Property
            </button>
        </div>

        <!-- Properties List -->
        <div class="bg-white rounded-2xl shadow-md p-6">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">All Properties</h3>
            <div id="properties-container"></div>
        </div>
    </div>

    <script type="module">
        import { initAuth, requireAdmin } from '/frontend/js/auth.js'
        import { createProperty, fetchAllProperties, updatePropertyStatus } from '/frontend/js/admin.js'
        import { formatMUR, showSuccess, showError } from '/frontend/js/ui.js'

        await requireAdmin()
        initAuth()

        async function loadProperties() {
            const properties = await fetchAllProperties()
            const container = document.getElementById('properties-container')

            if (properties.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">No properties yet</p>'
                return
            }

            container.innerHTML = `
                <div class="space-y-4">
                    ${properties.map(p => `
                        <div class="border border-gray-200 rounded-xl p-4">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h4 class="text-lg font-bold text-gray-800">${p.title}</h4>
                                    <p class="text-sm text-gray-600">${p.location}</p>
                                </div>
                                <select onchange="window.updateStatus('${p.id}', this.value)" class="px-3 py-1 rounded-lg border">
                                    <option value="DRAFT" ${p.status === 'DRAFT' ? 'selected' : ''}>Draft</option>
                                    <option value="OPEN" ${p.status === 'OPEN' ? 'selected' : ''}>Open</option>
                                    <option value="READY_TO_MINT" ${p.status === 'READY_TO_MINT' ? 'selected' : ''}>Ready to Mint</option>
                                    <option value="CLOSED" ${p.status === 'CLOSED' ? 'selected' : ''}>Closed</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-3 gap-4 text-sm">
                                <div>
                                    <p class="text-gray-600">Price/Lot</p>
                                    <p class="font-semibold">${formatMUR(p.price_per_lot)}</p>
                                </div>
                                <div>
                                    <p class="text-gray-600">Lots</p>
                                    <p class="font-semibold">${p.lots_sold} / ${p.total_lots}</p>
                                </div>
                                <div>
                                    <p class="text-gray-600">Raised</p>
                                    <p class="font-semibold">${formatMUR(p.amount_raised)}</p>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `
        }

        window.updateStatus = async (propertyId, newStatus) => {
            await updatePropertyStatus(propertyId, newStatus)
            await loadProperties()
        }

        document.getElementById('create-btn').addEventListener('click', async () => {
            const propertyData = {
                title: document.getElementById('title').value.trim(),
                location: document.getElementById('location').value.trim(),
                description: document.getElementById('description').value.trim(),
                price_per_lot: document.getElementById('price-per-lot').value,
                total_lots: parseInt(document.getElementById('total-lots').value),
                min_lot_purchase: parseInt(document.getElementById('min-lot').value),
                status: document.getElementById('status').value,
                images: [],
            }

            if (!propertyData.title || !propertyData.location || !propertyData.price_per_lot || !propertyData.total_lots) {
                showError('Please fill in all required fields')
                return
            }

            await createProperty(propertyData)
            await loadProperties()

            // Clear form
            document.getElementById('title').value = ''
            document.getElementById('location').value = ''
            document.getElementById('description').value = ''
            document.getElementById('price-per-lot').value = ''
            document.getElementById('total-lots').value = ''
            document.getElementById('min-lot').value = '1'
        })

        loadProperties()
    </script>
</body>
</html>
