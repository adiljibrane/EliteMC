<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - EliteMC Cooperative</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-600 mb-2">EliteMC</h1>
            <p class="text-gray-600">Property Investment Platform</p>
        </div>

        <!-- Auth Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Tabs -->
            <div class="flex border-b border-gray-200 mb-6">
                <button id="signin-tab" class="flex-1 py-3 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600">
                    Sign In
                </button>
                <button id="signup-tab" class="flex-1 py-3 text-center font-semibold text-gray-500 hover:text-gray-700">
                    Sign Up
                </button>
            </div>

            <!-- Sign In Form -->
            <div id="signin-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="signin-email" placeholder="you@example.com"
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-600 focus:border-transparent">
                </div>
                <button id="signin-btn" class="w-full px-4 py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition">
                    Send Magic Link
                </button>
                <p class="text-xs text-gray-500 text-center">
                    We'll send you a magic link to sign in without a password.
                </p>
            </div>

            <!-- Sign Up Form -->
            <div id="signup-form" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Doe"
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-600 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="signup-email" placeholder="you@example.com"
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-600 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Phone (Optional)</label>
                    <input type="tel" id="signup-phone" placeholder="+230 5xxx xxxx"
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-600 focus:border-transparent">
                </div>
                <button id="signup-btn" class="w-full px-4 py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition">
                    Create Account
                </button>
                <p class="text-xs text-gray-500 text-center">
                    By signing up, you agree to our Terms of Service and Privacy Policy.
                </p>
            </div>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-6">
            <a href="/index" class="text-gray-600 hover:text-gray-800 transition">
                ← Back to Home
            </a>
        </div>
    </div>

    <script type="module">
        import { handleSignIn, handleSignUp } from '/js/auth.js'
        import { supabase } from '/js/supabaseClient.js'

        // Handle magic link callback
        const handleAuthCallback = async () => {
            const hashParams = new URLSearchParams(window.location.hash.substring(1))
            const accessToken = hashParams.get('access_token')
            const refreshToken = hashParams.get('refresh_token')

            if (accessToken && refreshToken) {
                try {
                    const { data, error } = await supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    })

                    if (error) throw error

                    console.log('✅ Session established')
                    // Redirect to properties page
                    window.location.href = '/properties'
                    return
                } catch (error) {
                    console.error('Auth callback error:', error)
                }
            }
        }

        // Check for auth callback on page load
        handleAuthCallback()

        // Tab switching
        const signinTab = document.getElementById('signin-tab')
        const signupTab = document.getElementById('signup-tab')
        const signinForm = document.getElementById('signin-form')
        const signupForm = document.getElementById('signup-form')

        signinTab.addEventListener('click', () => {
            signinTab.classList.add('text-indigo-600', 'border-b-2', 'border-indigo-600')
            signinTab.classList.remove('text-gray-500')
            signupTab.classList.remove('text-indigo-600', 'border-b-2', 'border-indigo-600')
            signupTab.classList.add('text-gray-500')
            signinForm.classList.remove('hidden')
            signupForm.classList.add('hidden')
        })

        signupTab.addEventListener('click', () => {
            signupTab.classList.add('text-indigo-600', 'border-b-2', 'border-indigo-600')
            signupTab.classList.remove('text-gray-500')
            signinTab.classList.remove('text-indigo-600', 'border-b-2', 'border-indigo-600')
            signinTab.classList.add('text-gray-500')
            signupForm.classList.remove('hidden')
            signinForm.classList.add('hidden')
        })

        // Sign In Handler
        document.getElementById('signin-btn').addEventListener('click', async () => {
            const email = document.getElementById('signin-email').value.trim()
            const button = document.getElementById('signin-btn')

            if (!email) {
                alert('Please enter your email')
                return
            }

            await handleSignIn(email, button)
        })

        // Sign Up Handler
        document.getElementById('signup-btn').addEventListener('click', async () => {
            const email = document.getElementById('signup-email').value.trim()
            const fullName = document.getElementById('signup-name').value.trim()
            const phone = document.getElementById('signup-phone').value.trim()
            const button = document.getElementById('signup-btn')

            if (!email || !fullName) {
                alert('Please fill in all required fields')
                return
            }

            await handleSignUp(email, fullName, phone, button)
        })

        // Enter key support
        document.getElementById('signin-email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('signin-btn').click()
        })

        document.getElementById('signup-phone').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('signup-btn').click()
        })
    </script>
</body>
</html>
